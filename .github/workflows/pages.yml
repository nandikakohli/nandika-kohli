name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, feature/homepage-editable-cards ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website/svelte-website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: personal-website/svelte-website/package-lock.json

      - name: Cache SvelteKit
        uses: actions/cache@v4
        with:
          path: personal-website/svelte-website/.svelte-kit
          key: svelte-kit-${{ runner.os }}-${{ hashFiles('personal-website/svelte-website/svelte.config.js') }}
          restore-keys: |
            svelte-kit-${{ runner.os }}-

      - name: Install dependencies
        working-directory: personal-website/svelte-website
        run: npm ci --prefer-offline --no-audit --no-fund --silent

      - name: Build
        working-directory: personal-website/svelte-website
        run: npm run prepare && npm run build:pages
        env:
          GITHUB_PAGES: true
          CI: false

      - name: Ensure Pages artifact includes static files
        working-directory: personal-website/svelte-website
        run: test -f build/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: personal-website/svelte-website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
