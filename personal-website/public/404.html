<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/nandika-kohli/" />
    <meta name="robots" content="noindex" />
    <script>
      // If JS runs, preserve the path after the repo name by rebuilding a hash URL
      (function() {
        var path = window.location.pathname || '/nandika-kohli/';
        var base = '/nandika-kohli';
        if (!path.startsWith(base)) {
          window.location.replace('/nandika-kohli/');
          return;
        }
        var rest = path.slice(base.length);
        var target = base + '/#' + rest.replace(/^\//, '') + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
