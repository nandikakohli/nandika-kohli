<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages 404.html fallback for SvelteKit SPA routing
      (function() {
        var path = window.location.pathname;
        var base = '/nandika-kohli';
        
        // If path doesn't start with base, redirect to base
        if (!path.startsWith(base)) {
          window.location.replace(base + '/');
          return;
        }
        
        // Remove base from path
        var rest = path.slice(base.length) || '/';
        
        // Redirect to index.html which will handle the routing
        var target = base + '/index.html';
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
